server {
    listen 443 ssl http2;
    server_name vsemerch.com.ua www.vsemerch.com.ua;
    root /mnt/vsemerch-200/www/agcity/agcity.com.ua;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 128M;

    access_log /var/log/nginx/vsemerch.access.log;
    error_log  /var/log/nginx/vsemerch.error.log;

    # --- SSL ---
    ssl_certificate /etc/letsencrypt/live/vsemerch.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsemerch.com.ua/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Allow only validation files for certbot ---
    location ~ ^/\.well-known/(acme-challenge|pki-validation)/ {
        allow all;
        default_type "text/plain";
    }

    # --- Забороняємо доступ до прихованих файлів (.git, .env, тощо) ---
    location ~ /\.(ht|svn|git|env) {
        deny all;
    }

    # --- /admin → backend/web ---
    location ^~ /admin {
        rewrite ^/admin/?(.*)$ /backend/web/$1 last;
    }

    # --- Головний rewrite (усе інше → frontend/web) ---
    location / {
        rewrite ^/(?!frontend/web|backend/web|admin)(.*)$ /frontend/web/$1 last;
    }

    # ===== FRONTEND =====
    location ^~ /frontend/web/ {
        root /mnt/vsemerch-200/www/agcity/agcity.com.ua;
        index index.php;
        try_files $uri $uri/ /frontend/web/index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
            expires max;
            access_log off;
        }
    }

    # ===== BACKEND =====
    location ^~ /backend/web/ {
        root /mnt/vsemerch-200/www/agcity/agcity.com.ua;
        index index.php;
        try_files $uri $uri/ /backend/web/index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
            expires max;
            access_log off;
        }
    }

    # --- Обробка 404 через frontend ---
    error_page 404 /frontend/web/index.php;
}

# --- HTTP → HTTPS ---
server {
    listen 80;
    server_name vsemerch.com.ua www.vsemerch.com.ua;

    # allow certbot verification
    location ~ ^/\.well-known/(acme-challenge|pki-validation)/ {
        allow all;
    }

    return 301 https://$host$request_uri;
}
