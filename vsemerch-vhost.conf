<VirtualHost *:80>
    ServerAdmin webmaster@vsemerch.loc
    DocumentRoot "D:/DEV/htdocs/vsemerch.loc/frontend/web"
    ServerName vsemerch.loc
    ErrorLog "logs/vsemerch.loc-error.log"
    CustomLog "logs/vsemerch.loc-access.log" common

    Alias /admin "D:/DEV/htdocs/vsemerch.loc/backend/web"

    <Directory "D:/DEV/htdocs/vsemerch.loc/frontend/web">
        DirectoryIndex index.php
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.php [L]
    </Directory>

    <Directory "D:/DEV/htdocs/vsemerch.loc/backend/web">
        DirectoryIndex index.php
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteBase /admin
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.php [L]
    </Directory>
</VirtualHost>
